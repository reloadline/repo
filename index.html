<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>reloadline iOS Repo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1419;
        --panel: #18202a;
        --text: #eef3f7;
        --muted: #a8b3bd;
        --accent: #37c871;
        --line: #2d3a45;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }

      .mark {
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--accent);
        font: 700 28px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      h1 {
        margin: 24px 0 8px;
        font-size: clamp(32px, 8vw, 64px);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.6;
      }

      .actions {
        display: grid;
        gap: 12px;
        margin-top: 28px;
      }

      a {
        color: inherit;
      }

      .button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 52px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        text-decoration: none;
        font-weight: 650;
      }

      .button span:last-child {
        color: var(--accent);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      code {
        display: block;
        margin-top: 28px;
        padding: 16px;
        overflow-wrap: anywhere;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0a0d10;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">apt</div>
      <h1>reloadline iOS Repo</h1>
      <p>Personal jailbreak package source for Sileo, Zebra, and Cydia-compatible package managers.</p>

      <div class="actions">
        <a class="button" href="sileo://source/https://reloadline.github.io/ios-jailbreak-source/">
          <span>Add to Sileo</span>
          <span>open</span>
        </a>
        <a class="button" href="zbra://sources/add/https://reloadline.github.io/ios-jailbreak-source/">
          <span>Add to Zebra</span>
          <span>open</span>
        </a>
        <a class="button" href="cydia://url/https://cydia.saurik.com/api/share#?source=https://reloadline.github.io/ios-jailbreak-source/">
          <span>Add to Cydia</span>
          <span>open</span>
        </a>
      </div>

      <code>https://reloadline.github.io/ios-jailbreak-source/</code>
    </main>
  </body>
</html>
